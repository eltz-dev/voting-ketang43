<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pemilihan Ketua Angkatan 43 SMAN 1 SEMIN</title>
<link rel="icon" type="image/jpeg" href="https://files.catbox.moe/adcvhb.jpeg">
<link rel="stylesheet" href="style.css">
<style>
  .hero-wrap{
    width:100%;
    max-width:560px;
  }
  .seal43{
    width:64px; height:64px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono);
    font-size:22px; font-weight:700;
    color:var(--gold-soft);
    transform:rotate(-6deg);
    margin-bottom:26px;
    background:radial-gradient(circle at 35% 30%, rgba(228,200,120,.12), transparent 70%);
  }
  .hero-card{
    text-align:left;
  }
  .hero-eyebrow{ margin-bottom:20px; }
  .hero-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(34px, 7vw, 54px);
    line-height:1.08;
    letter-spacing:-.015em;
    color:var(--text-light);
    margin-bottom:18px;
  }
  .hero-title em{
    font-style:italic;
    font-weight:500;
    color:var(--gold-soft);
  }
  .hero-sub{
    font-size:15.5px;
    line-height:1.65;
    color:var(--text-muted);
    max-width:44ch;
    margin-bottom:34px;
  }
  .hero-meta{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:38px;
    padding-top:22px;
    border-top:1px solid var(--navy-700);
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:.03em;
  }
  .hero-meta .dot{ width:6px; height:6px; border-radius:50%; background:var(--green-ok); flex:none; box-shadow:0 0 0 3px rgba(92,143,104,.2); }
  .enter-link{ display:inline-block; text-decoration:none; }
  .hall-frame{
    position:fixed;
    inset:18px;
    border:1px solid rgba(228,200,120,.14);
    border-radius:28px;
    pointer-events:none;
    z-index:0;
  }
  @media (max-width:520px){ .hall-frame{ inset:10px; border-radius:20px; } }
</style>
</head>
<body>
<div class="hall-frame"></div>
<main class="center-screen">
  <div class="hero-wrap hero-card">
    <div class="seal43">43</div>
    <div class="eyebrow hero-eyebrow">Pemilu Angkatan &middot; SMAN 1 Semin</div>
    <h1 class="hero-title">Welcome To The Web Voting <em>Ketua Angkatan</em></h1>
    <p class="hero-sub">Ruang suara digital untuk Angkatan 43. Satu klik, satu suara — pastikan kamu memilih dengan jujur sebelum masuk ke bilik voting.</p>
    <a href="voting.html" class="enter-link stamp-btn" id="enterBtn">
      <span class="ripple" id="enterRipple"></span>
      Enter →
    </a>
    <div class="hero-meta">
      <span class="dot"></span>
      Sistem voting Virtual &middot; Angkatan 43
    </div>
  </div>
</main>

<script>
  const enterBtn = document.getElementById('enterBtn');
  enterBtn.addEventListener('click', function(e){
    e.preventDefault();
    const ripple = document.getElementById('enterRipple');
    const s = document.createElement('span');
    const size = 220;
    s.style.width = s.style.height = size + 'px';
    s.style.left = '50%';
    s.style.top = '50%';
    s.style.marginLeft = -(size/2) + 'px';
    s.style.marginTop = -(size/2) + 'px';
    ripple.appendChild(s);
    setTimeout(() => { window.location.href = 'voting.html'; }, 200);
  });
</script>
</body>
</html>
